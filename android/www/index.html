<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
</head>
<body>
<title>InventoryHolding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --color-canvas:#f2f3f6;
  --color-paper:#ffffff;
  --color-surface-alt:#fafafa;
  --color-ink:#0a0a0a;
  --color-ink-soft:#171717;
  --color-mid-gray:#737373;
  --color-hairline:#e5e5e5;
  --color-ember:#e5484d;
  --color-ember-bg:#fdeced;
  --color-ember-border:#f6c8ca;
  --color-backdrop:#e4e5e9;
  --color-on-ink:#fafafa;
  --brand-mark-bg:#15161b;
  --brand-mark-fg:#ffffff;
  --shadow-card: 0 1px 2px rgba(16,18,23,.04), 0 8px 20px rgba(16,18,23,.07);
  --shadow-fab: 0 10px 22px rgba(16,18,23,.30);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --color-canvas:#0a0a0b;
    --color-paper:#18191d;
    --color-surface-alt:#141416;
    --color-ink:#fafafa;
    --color-ink-soft:#e5e5e5;
    --color-mid-gray:#a3a3a3;
    --color-hairline:#2a2b30;
    --color-ember:#ff5459;
    --color-ember-bg:#2a1416;
    --color-ember-border:#4a2226;
    --color-backdrop:#000000;
    --color-on-ink:#0a0a0a;
    --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.45);
    --shadow-fab: 0 10px 22px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --color-canvas:#0a0a0b;
  --color-paper:#18191d;
  --color-surface-alt:#141416;
  --color-ink:#fafafa;
  --color-ink-soft:#e5e5e5;
  --color-mid-gray:#a3a3a3;
  --color-hairline:#2a2b30;
  --color-ember:#ff5459;
  --color-ember-bg:#2a1416;
  --color-ember-border:#4a2226;
  --color-backdrop:#000000;
  --color-on-ink:#0a0a0a;
  --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.45);
  --shadow-fab: 0 10px 22px rgba(0,0,0,.5);
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--color-backdrop);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--color-ink);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;}
h1,h2,h3,p{margin:0;}
::selection{background:var(--color-ink);color:var(--color-on-ink);}

.app-shell{
  max-width:480px;
  margin-inline:auto;
  min-height:100vh;
  background:var(--color-canvas);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}
@media (min-width:481px){
  .app-shell{box-shadow:0 0 0 1px var(--color-hairline), 0 12px 48px rgba(0,0,0,.12);}
}

/* Topbar */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--color-canvas);
  padding:14px 16px 12px;
  display:flex;align-items:center;gap:10px;
  min-height:28px;
}
.topbar-back{
  width:32px;height:32px;border-radius:10px;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--color-ink);flex:none;cursor:pointer;
}
.topbar-back:active{background:var(--color-hairline);}
.topbar-titles{flex:1;min-width:0;}
.topbar-eyebrow{font-size:12px;line-height:1.33;letter-spacing:.6px;text-transform:uppercase;color:var(--color-mid-gray);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-title{font-size:20px;line-height:1.2;letter-spacing:-.4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-row{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}
.brand-mark{
  width:38px;height:38px;border-radius:12px;background:var(--brand-mark-bg);color:var(--brand-mark-fg);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.brand-titles{min-width:0;}
.brand-name{font-size:16px;font-weight:700;line-height:1.2;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brand-sub{font-size:12px;color:var(--color-mid-gray);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bell-btn{
  position:relative;flex:none;width:40px;height:40px;border-radius:14px;border:none;background:var(--color-paper);
  box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;color:var(--color-ink);cursor:pointer;
}
.bell-btn .nav-badge{top:-4px;right:-4px;}

/* Screen */
.screen{flex:1;padding:4px 16px 100px;}
.screen-pad-top{padding-top:8px;}

/* Bottom nav */
.bottom-nav{
  position:sticky;bottom:0;z-index:20;
  background:var(--color-paper);
  box-shadow:0 -1px 0 var(--color-hairline), 0 -8px 20px rgba(16,18,23,.05);
  display:flex;align-items:flex-start;
  padding:10px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;padding:4px 2px;color:var(--color-mid-gray);cursor:pointer;position:relative;
}
.nav-item .nav-icon{position:relative;}
.nav-item span{font-size:11px;font-weight:500;letter-spacing:.1px;}
.nav-item.active{color:var(--color-ink);}
.nav-item .active-dot{width:4px;height:4px;border-radius:50%;background:var(--color-ink);margin-top:1px;opacity:0;}
.nav-item.active .active-dot{opacity:1;}
.nav-slot{flex:1;display:flex;justify-content:center;}
.nav-badge{
  position:absolute;top:-3px;right:-9px;background:var(--color-ember);color:#fff;
  font-size:10px;font-weight:600;min-width:15px;height:15px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* FAB (center of bottom nav) */
.fab{
  width:52px;height:52px;border-radius:50%;background:var(--brand-mark-bg);color:var(--brand-mark-fg);
  border:3px solid var(--color-paper);display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:var(--shadow-fab);margin-top:-26px;flex:none;
}
.fab:active{opacity:.85;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:44px;padding:0 16px;border-radius:18px;font-size:14px;font-weight:500;
  border:none;cursor:pointer;text-decoration:none;white-space:nowrap;
}
.btn.block{width:100%;}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:18px;}
.btn.primary{background:var(--color-ink);color:var(--color-on-ink);}
.btn.primary:active{opacity:.85;}
.btn.secondary{background:var(--color-canvas);color:var(--color-ink);}
.btn.secondary:active{background:var(--color-hairline);}
.btn.outline{background:transparent;color:var(--color-ink);border:1px solid var(--color-hairline);}
.btn.outline:active{background:var(--color-surface-alt);}
.btn.danger{background:transparent;color:var(--color-ember);border:1px solid var(--color-hairline);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* Cards */
.card{
  background:var(--color-paper);border:1px solid rgba(16,18,23,.04);border-radius:20px;
  box-shadow:var(--shadow-card);padding:20px;
}
.card + .card{margin-top:12px;}
.card-header{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--color-hairline);}
.card-footer{padding-top:12px;margin-top:12px;border-top:1px solid var(--color-hairline);}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:18px;padding:2px 9px;font-size:12px;font-weight:500;line-height:1.6;white-space:nowrap;}
.badge.solid{background:var(--color-ink-soft);color:var(--color-on-ink);}
.badge.soft{background:var(--color-canvas);color:var(--color-ink-soft);}
.badge.outline{background:transparent;color:var(--color-ink);border:1px solid var(--color-hairline);}
.badge.ember{background:rgba(231,0,11,.1);color:var(--color-ember);}
.badge.ember-solid{background:var(--color-ember);color:#fff;}

/* Inputs */
.field{margin-bottom:14px;}
.card>.field:last-child,.card>form>.field:last-child{margin-bottom:0;}
.field-label{display:block;font-size:12px;font-weight:500;color:var(--color-mid-gray);margin-bottom:6px;letter-spacing:.2px;}
.input,.textarea,select.input{
  width:100%;background:var(--color-canvas);border:1px solid transparent;border-radius:18px;
  padding:11px 14px;font-size:14px;color:var(--color-ink);outline:none;
}
.input::placeholder,.textarea::placeholder{color:var(--color-mid-gray);}
.input:focus,.textarea:focus{border-color:var(--color-hairline);background:var(--color-paper);}
.textarea{min-height:76px;resize:vertical;line-height:1.43;}
.input-qty{font-size:28px;font-weight:600;text-align:center;padding:16px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap .input{padding-left:38px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-mid-gray);}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-block{background:var(--color-paper);border:1px solid var(--color-hairline);border-radius:24px;box-shadow:var(--shadow-card);padding:16px;}
.stat-label{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--color-mid-gray);font-weight:500;}
.stat-value{font-size:30px;font-weight:600;letter-spacing:-.75px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1;}
.stat-sub{font-size:12px;color:var(--color-mid-gray);margin-top:4px;}

/* Section title */
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--color-mid-gray);font-weight:600;margin:22px 2px 10px;}
.section-title:first-child{margin-top:4px;}

/* Lists — each row is its own elevated card */
.list-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;
  background:var(--color-paper);border:1px solid rgba(16,18,23,.04);border-radius:16px;
  box-shadow:var(--shadow-card);margin-bottom:10px;
}
.list-item:last-child{margin-bottom:0;}
.list-stack{display:flex;flex-direction:column;}
.list-item .icon-wrap{
  width:38px;height:38px;border-radius:12px;background:var(--color-canvas);display:flex;align-items:center;
  justify-content:center;flex:none;color:var(--color-ink-soft);
}
.list-item .li-body{flex:1;min-width:0;}
.li-title{font-size:14px;font-weight:600;color:var(--color-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li-sub{font-size:12px;color:var(--color-mid-gray);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li-trail{flex:none;display:flex;align-items:center;gap:8px;color:var(--color-mid-gray);}
.li-qty{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--color-ink);}
.li-qty.danger{color:var(--color-ember);}

/* Alert banner */
.alert-banner{
  display:flex;align-items:center;gap:12px;background:var(--color-ember-bg);border:1px solid var(--color-ember-border);
  border-radius:16px;padding:13px 14px;cursor:pointer;margin-bottom:14px;
}
.alert-banner .ab-icon{color:var(--color-ember);flex:none;}
.alert-banner .ab-count{font-size:17px;font-weight:700;color:var(--color-ember);flex:none;font-variant-numeric:tabular-nums;}
.alert-banner .ab-text{flex:1;font-size:13px;font-weight:500;color:var(--color-ink);}
.alert-banner .ab-chev{flex:none;color:var(--color-ember);}

/* Quick action cards */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.action-card{
  background:var(--color-paper);border:1px solid rgba(16,18,23,.04);border-radius:18px;box-shadow:var(--shadow-card);
  padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;
}
.action-card .ac-icon{width:36px;height:36px;border-radius:11px;background:var(--brand-mark-bg);color:var(--brand-mark-fg);display:flex;align-items:center;justify-content:center;}
.action-card .ac-label{font-size:14px;font-weight:700;color:var(--color-ink);}
.action-card .ac-sub{font-size:12px;color:var(--color-mid-gray);margin-top:-6px;}

/* Stage tracker */
.stage-track{display:flex;gap:6px;margin:2px 0 4px;}
.stage-step{flex:1;height:5px;border-radius:3px;background:var(--color-hairline);}
.stage-step.done{background:var(--color-ink-soft);}
.stage-step.active{background:var(--color-ink);}
.stage-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--color-mid-gray);margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.3px;}

/* Progress bar */
.progress-track{height:6px;background:var(--color-canvas);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--color-ink);border-radius:3px;}

/* Filter chips */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:none;border:1px solid var(--color-hairline);background:var(--color-paper);color:var(--color-ink);
  border-radius:18px;padding:7px 13px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--color-ink);color:var(--color-on-ink);border-color:var(--color-ink);}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--color-mid-gray);}
.empty-state .icon-wrap{
  width:52px;height:52px;border-radius:26px;background:var(--color-surface-alt);border:1px solid var(--color-hairline);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--color-mid-gray);
}
.empty-state h3{font-size:16px;font-weight:600;color:var(--color-ink);margin-bottom:4px;}
.empty-state p{font-size:13px;line-height:1.5;}

/* Compare rows (conference/validation detail) */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.compare-box{background:var(--color-canvas);border-radius:18px;padding:14px;text-align:center;}
.compare-box .cb-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--color-mid-gray);font-weight:600;}
.compare-box .cb-value{font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
.compare-box.diff .cb-value{color:var(--color-ember);}

.kv-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--color-hairline);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--color-mid-gray);}
.kv-row .v{font-weight:500;text-align:right;}

.note-box{background:var(--color-canvas);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--color-ink-soft);margin-top:10px;}
.note-box .nb-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-mid-gray);font-weight:600;margin-bottom:4px;}

.avatar{width:30px;height:30px;border-radius:50%;background:var(--color-ink-soft);color:var(--color-on-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;}

.role-card{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--color-hairline);border-radius:18px;background:var(--color-paper);cursor:pointer;margin-bottom:10px;}
.role-card.selected{border-color:var(--color-ink);background:var(--color-surface-alt);}
.role-card .rc-icon{width:36px;height:36px;border-radius:11px;background:var(--color-canvas);display:flex;align-items:center;justify-content:center;flex:none;color:var(--color-ink-soft);}
.role-card.selected .rc-icon{background:var(--color-ink);color:var(--color-on-ink);}
.role-card .rc-title{font-size:14px;font-weight:600;}
.role-card .rc-desc{font-size:12px;color:var(--color-mid-gray);margin-top:2px;line-height:1.4;}
.role-card .rc-check{margin-left:auto;flex:none;color:var(--color-ink);}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--color-surface-alt);border:1px solid var(--color-hairline);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--color-ink-soft);margin-bottom:14px;}
.banner svg{flex:none;margin-top:1px;color:var(--color-mid-gray);}
.banner.ember{background:rgba(231,0,11,.06);border-color:rgba(231,0,11,.2);color:var(--color-ember);}
.banner.ember svg{color:var(--color-ember);}

.greeting{font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.25;}
.greeting-sub{font-size:14px;color:var(--color-mid-gray);margin-top:4px;}

.btn-row{display:flex;gap:10px;margin-top:16px;}
.btn-row .btn{flex:1;}

.toast{
  position:absolute;left:16px;right:16px;bottom:96px;z-index:60;
  background:var(--color-ink);color:var(--color-on-ink);border-radius:18px;padding:12px 16px;
  font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);
  text-align:center;
}
[hidden]{display:none!important;}

/* Login */
.login-screen{
  flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;
  padding:32px 24px calc(32px + env(safe-area-inset-bottom));background:var(--color-canvas);
}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:32px;}
.login-mark{width:64px;height:64px;border-radius:20px;background:var(--brand-mark-bg);color:var(--brand-mark-fg);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-fab);}
.login-name{font-size:22px;font-weight:700;letter-spacing:-.3px;}
.login-tag{font-size:13px;color:var(--color-mid-gray);margin-top:-8px;text-align:center;}
.login-hint{display:flex;align-items:center;gap:8px;background:var(--color-surface-alt);border:1px solid var(--color-hairline);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--color-mid-gray);margin-bottom:16px;}
.login-hint b{color:var(--color-ink);font-weight:600;}
.login-error{display:flex;align-items:center;gap:8px;background:var(--color-ember-bg);border:1px solid var(--color-ember-border);color:var(--color-ember);border-radius:14px;padding:10px 12px;font-size:12px;font-weight:500;margin-bottom:14px;}
.app-shell.fading-out{animation:shellFadeOut .38s ease forwards;}
.app-shell.fading-in{animation:shellFadeIn .45s ease both;}
@keyframes shellFadeOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.98);}}
@keyframes shellFadeIn{from{opacity:0;transform:scale(1.01);}to{opacity:1;transform:scale(1);}}

/* Boot animation */
#boot-shell{background:var(--brand-mark-bg);align-items:center;justify-content:center;cursor:pointer;}
.boot-stage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px;}
.boot-crates{position:relative;width:100px;height:110px;flex:none;}
.boot-crate{
  position:absolute;left:50%;width:68px;height:24px;margin-left:-34px;border-radius:7px;
  background:var(--color-on-ink);box-shadow:0 4px 14px rgba(0,0,0,.25);
  opacity:0;transform:translateY(18px) scale(.85);
  animation:bootCrateIn .55s cubic-bezier(.22,.9,.32,1.3) forwards;
}
.boot-crate::before{content:'';position:absolute;left:8px;right:8px;top:50%;height:2px;margin-top:-1px;background:var(--brand-mark-bg);opacity:.5;border-radius:1px;}
.boot-crate:nth-child(1){bottom:6px;animation-delay:.05s;}
.boot-crate:nth-child(2){bottom:34px;animation-delay:.3s;}
.boot-crate:nth-child(3){bottom:62px;animation-delay:.55s;}
@keyframes bootCrateIn{
  0%{opacity:0;transform:translateY(18px) scale(.85);}
  65%{opacity:1;transform:translateY(-4px) scale(1.04);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
.boot-check{
  position:absolute;top:-6px;left:50%;width:34px;height:34px;margin-left:-17px;border-radius:50%;
  background:var(--color-ember);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transform:scale(.3);
  animation:bootCheckIn .45s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:.95s;
}
@keyframes bootCheckIn{to{opacity:1;transform:scale(1);}}
.boot-name{
  font-size:21px;font-weight:700;letter-spacing:-.3px;color:var(--brand-mark-fg);
  opacity:0;transform:translateY(6px);animation:bootTextIn .5s ease forwards;animation-delay:1.15s;
}
.boot-tag{
  font-size:12px;color:rgba(255,255,255,.55);margin-top:-14px;
  opacity:0;transform:translateY(6px);animation:bootTextIn .5s ease forwards;animation-delay:1.3s;
}
.boot-hint{

function toSnakeKey(k){ return k.replace(/[A-Z]/g, function(m){ return '_'+m.toLowerCase(); }); }
function toCamelKey(k){ return k.replace(/_([a-z0-9])/g, function(_,c){ return c.toUpperCase(); }); }
function sbKeyToDb(logical,k){ var al=SB_ALIASES[logical]; if(al && al.js2db[k]) return al.js2db[k]; return toSnakeKey(k); }
function sbKeyFromDb(logical,k){ var al=SB_ALIASES[logical]; if(al && al.db2js[k]) return al.db2js[k]; return toCamelKey(k); }
function sbRowToDb(logical,obj){ var out={}; Object.keys(obj).forEach(function(k){ out[sbKeyToDb(logical,k)] = obj[k]; }); return out; }
function sbRowFromDb(logical,row){ var out={}; Object.keys(row).forEach(function(k){ out[sbKeyFromDb(logical,k)] = row[k]; }); return out; }

function createSupabaseDB(client){
  function tableFor(logical){ return SB_TABLES[logical] || logical; }
  function snapFromRow(logical, id, row){
    var data = row ? sbRowFromDb(logical, row) : undefined;
    return { id:id, exists:!!row, data:function(){ return data; }, metadata:{fromCache:false,hasPendingWrites:false} };
  }

  /* Every viewer's screen stays live: each onSnapshot() registers a
     listener here; a write refreshes matching listeners immediately
     (so the acting user always sees their own change reflected right
     away), and a best-effort Realtime channel per table refreshes
     everyone else too when the table is in the supabase_realtime
     publication (see supabase/schema.sql). If Realtime isn't enabled
     the app still works — other viewers just see the change next time
     they navigate or reload, same as the immediate-refresh path. */
  var listeners = new Set();
  var realtimeChannels = {};

  function ensureRealtime(table){
    if(realtimeChannels[table]) return;
    try{
      var channel = client.channel('rt-'+table)
        .on('postgres_changes', { event:'*', schema:'public', table:table }, function(){ refreshTable(table); })
        .subscribe();
      realtimeChannels[table] = channel;
    }catch(e){ /* Realtime not available/enabled — manual refresh below still covers our own writes */ }
  }

  function refreshTable(table){
    listeners.forEach(function(l){
      if(l.table !== table) return;
      var p = l.kind==='doc' ? fetchDoc(l.logical, l.table, l.id) : fetchQuery(l.logical, l.table, l.wheres, l.limitN);
      p.then(l.cb).catch(function(e){ if(l.onErr) l.onErr(e); });
    });
  }

  async function fetchDoc(logical, table, id){
    var res = await client.from(table).select('*').eq('id', id).maybeSingle();
    if(res.error) throw res.error;
    return snapFromRow(logical, id, res.data);
  }
  async function fetchQuery(logical, table, wheres, limitN){
    var q = client.from(table).select('*');
    wheres.forEach(function(w){
      var col = sbKeyToDb(logical, w[0]);
      if(w[1]==='==') q = q.eq(col, w[2]);
      else if(w[1]==='!=') q = q.neq(col, w[2]);
      else if(w[1]==='<') q = q.lt(col, w[2]);
      else if(w[1]==='<=') q = q.lte(col, w[2]);
      else if(w[1]==='>') q = q.gt(col, w[2]);
      else if(w[1]==='>=') q = q.gte(col, w[2]);
      else if(w[1]==='in') q = q.in(col, w[2]);
    });
    if(limitN) q = q.limit(limitN);
    var res = await q;
    if(res.error) throw res.error;
    var docs = (res.data||[]).map(function(row){ return snapFromRow(logical, row.id, row); });
    return { docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){ return []; }, metadata:{fromCache:false,hasPendingWrites:false} };
  }

  function makeDocRef(path){
    var seg = path.split('/'), logical = seg[0], id = seg[1], table = tableFor(logical);
    return {
      id:id, path:path,
      get: function(){ return fetchDoc(logical, table, id); },
      set: async function(data){
        var payload = sbRowToDb(logical, data);
        payload.id = id;
        if(SB_STATE.empresaId) payload.empresa_id = SB_STATE.empresaId;
        var res = await client.from(table).upsert(payload);
        if(res.error) throw res.error;
        refreshTable(table);
      },
      update: async function(data){
        var res = await client.from(table).update(sbRowToDb(logical, data)).eq('id', id);
        if(res.error) throw res.error;
        refreshTable(table);
      },
      delete: async function(){
        var res = await client.from(table).delete().eq('id', id);
        if(res.error) throw res.error;
        refreshTable(table);
      },
      onSnapshot: function(next, onErr){
        var l = { kind:'doc', table:table, id:id, logical:logical, cb:next, onErr:onErr };
        listeners.add(l);
        ensureRealtime(table);
        fetchDoc(logical, table, id).then(next).catch(function(e){ if(onErr) onErr(e); });
        return function(){ listeners.delete(l); };
      },
      collection: function(sub){ return makeCollRef(path+'/'+sub); }
    };
  }
  function makeCollRef(path, wheres, limitN){
    wheres = wheres||[];
    var seg = path.split('/'), logical = seg[0], table = tableFor(logical);
    var ref = {
      path:path,
      where: function(f,op,v){ return makeCollRef(path, wheres.concat([[f,op,v]]), limitN); },
      orderBy: function(){ return ref; },
      limit: function(n){ return makeCollRef(path, wheres, n); },
      doc: function(id){ return makeDocRef(path+'/'+(id||uid())); },
      add: async function(data){ var r = ref.doc(); await r.set(data); return r; },
      get: function(){ return fetchQuery(logical, table, wheres, limitN); },
      onSnapshot: function(next, onErr){
        var l = { kind:'query', table:table, logical:logical, wheres:wheres, limitN:limitN, cb:next, onErr:onErr };
        listeners.add(l);
        ensureRealtime(table);
        fetchQuery(logical, table, wheres, limitN).then(next).catch(function(e){ if(onErr) onErr(e); });
        return function(){ listeners.delete(l); };
      }
    };
    return ref;
  }
  return { doc:function(p){ return makeDocRef(p); }, collection:function(p){ return makeCollRef(p); } };
}

/* ---------------- Local fallback store (used only if db capability is unavailable) ---------------- */
function createLocalDB(){
  var KEY='balanco-certo:localdb:v1';
  var store={};
  try{ store = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ store={}; }
  var listeners = new Set();
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  function parentOf(p){ var s=p.split('/'); s.pop(); return s.join('/'); }
  function passWhere(data, wheres){
    return wheres.every(function(w){
      var f=w[0], op=w[1], v=w[2], val = data[f];
      switch(op){
        case '==': return val===v;
        case '!=': return val!==v;
        case '<': return val<v;
        case '<=': return val<=v;
        case '>': return val>v;
        case '>=': return val>=v;
        case 'in': return Array.isArray(v)&&v.indexOf(val)!==-1;
        case 'not-in': return Array.isArray(v)&&v.indexOf(val)===-1;
        case 'array-contains': return Array.isArray(val)&&val.indexOf(v)!==-1;
        default: return true;
      }
    });
  }
  function snapDoc(path){
    var data = store[path];
    return { id:path.split('/').pop(), exists: data!==undefined, data:function(){return data;}, metadata:{fromCache:false,hasPendingWrites:false} };
  }
  function collEntries(collPath){
    var out=[];
    for(var p in store){ if(parentOf(p)===collPath) out.push([p, store[p]]); }
    return out;
  }
  function notify(){
    listeners.forEach(function(l){
      if(l.type==='doc'){ l.cb(snapDoc(l.path)); }
      else{
        var entries = collEntries(l.collPath).filter(function(e){ return passWhere(e[1], l.wheres); });
        if(l.order){ entries.sort(function(a,b){ var av=a[1][l.order[0]], bv=b[1][l.order[0]]; if(av===bv) return 0; return (av>bv?1:-1)*(l.order[1]==='desc'?-1:1); }); }
        if(l.limitN) entries = entries.slice(0,l.limitN);
        var docs = entries.map(function(e){ return snapDoc(e[0]); });
        l.cb({ docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){return [];}, metadata:{fromCache:false,hasPendingWrites:false} });
      }
    });
  }
  function makeDocRef(path){
    var ref = {
      id: path.split('/').pop(), path: path,
      get: function(){ return Promise.resolve(snapDoc(path)); },
      set: function(data){ store[path]=JSON.parse(JSON.stringify(data)); persist(); notify(); return Promise.resolve(); },
      update: function(data){ store[path]=Object.assign({}, store[path]||{}, JSON.parse(JSON.stringify(data))); persist(); notify(); return Promise.resolve(); },
      delete: function(){ delete store[path]; persist(); notify(); return Promise.resolve(); },
      onSnapshot: function(next){ var l={type:'doc',path:path,cb:next}; listeners.add(l); next(snapDoc(path)); return function(){ listeners.delete(l); }; },
      collection: function(sub){ return makeCollRef(path+'/'+sub); }
    };
    return ref;
  }
  function makeCollRef(path, wheres, order, limitN){
    wheres = wheres||[];
    var ref = {
      path: path,
      where: function(f,op,v){ return makeCollRef(path, wheres.concat([[f,op,v]]), order, limitN); },
      orderBy: function(f,d){ return makeCollRef(path, wheres, [f, d||'asc'], limitN); },
      limit: function(n){ return makeCollRef(path, wheres, order, n); },
      doc: function(id){ return makeDocRef(path+'/'+(id||uid())); },
      add: function(data){ var r=ref.doc(); return r.set(data).then(function(){ return r; }); },
      get: function(){
        var entries = collEntries(path).filter(function(e){ return passWhere(e[1], wheres); });
        if(order){ entries.sort(function(a,b){ var av=a[1][order[0]], bv=b[1][order[0]]; if(av===bv) return 0; return (av>bv?1:-1)*(order[1]==='desc'?-1:1); }); }
        if(limitN) entries = entries.slice(0,limitN);
        var docs = entries.map(function(e){ return snapDoc(e[0]); });
        return Promise.resolve({ docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){return [];}, metadata:{fromCache:false,hasPendingWrites:false} });
      },
      onSnapshot: function(next){ var l={type:'query',collPath:path,wheres:wheres,order:order,limitN:limitN,cb:next}; listeners.add(l); ref.get().then(next); return function(){ listeners.delete(l); }; }
    };
    return ref;
  }
  return { doc:function(p){ return makeDocRef(p); }, collection:function(p){ return makeCollRef(p); } };
}

/* ---------------- Data layer ----------------
   storeReady resolves to whichever backend is active:
   - Claude Artifact db capability (when embedded there)
   - Supabase (when SUPABASE_CONFIG is filled in) — resolved only after
     login succeeds, since writes need to know the logged-in empresaId
   - localStorage fallback (demo mode, no backend configured) */
var db = null;
var _storeResolve;
var storeReady = new Promise(function(resolve){ _storeResolve = resolve; });
function resolveStore(instance){ db = instance; _storeResolve(instance); }

(async function initNonSupabaseStore(){
  if(supabaseConfigured()) return; // Supabase path resolves later, from finalizeSupabaseLogin()
  try{
    if(window.claude && window.claude.use){
      db = await window.claude.use('db');
    }
  }catch(e){ db = null; }
  if(!db) db = createLocalDB();
  resolveStore(db);
})();

function finalizeSupabaseLogin(client){
  USING_SUPABASE = true;
  resolveStore(createSupabaseDB(client));
}

var audits = {};           // id -> data
var itemsByAudit = {};     // auditId -> { sku -> data }
var itemsQueue = { pendente:[], divergente:[], conferido:[], alerta_gestor:[] };
var auditsUnsub = null;
var itemsUnsub = null;
var queueUnsub = null;
var currentAuditIdSubscribed = null;

function subscribeAudits(){
  if(auditsUnsub) return;
  storeReady.then(function(store){
    auditsUnsub = store.collection('audits').onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(d){ next[d.id] = Object.assign({id:d.id}, d.data()); });
      audits = next;
      render();
    }, function(){ });
  });
}

function subscribeItemsForAudit(auditId){
  if(currentAuditIdSubscribed === auditId && itemsUnsub) return;
  if(itemsUnsub){ itemsUnsub(); itemsUnsub = null; }
  currentAuditIdSubscribed = auditId;
  storeReady.then(function(store){
    if(currentAuditIdSubscribed !== auditId) return;
    itemsUnsub = store.collection('items').where('auditId','==',auditId).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.data().sku] = Object.assign({id:d.id}, d.data()); });
      itemsByAudit[auditId] = map;
      render();
    }, function(){ });
  });
}

function unsubscribeItems(){
  if(itemsUnsub){ itemsUnsub(); itemsUnsub = null; }
  currentAuditIdSubscribed = null;
}

function subscribeQueue(status){
  if(queueUnsub && queueUnsub._status === status) return;
  if(queueUnsub){ queueUnsub(); queueUnsub = null; }
  storeReady.then(function(store){
    var unsub = store.collection('items').where('status','==',status).onSnapshot(function(snap){
      itemsQueue[status] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(){ });
    unsub._status = status;
    queueUnsub = unsub;
  });
}
function unsubscribeQueue(){ if(queueUnsub){ queueUnsub(); queueUnsub=null; } }

function computeAggregateFromItems(items){
  var total = items.length, pendentes=0, divergentes=0, conferidos=0, ok=0, validados=0, alertas=0;
  items.forEach(function(it){
    if(it.status==='pendente') pendentes++;
    else if(it.status==='divergente') divergentes++;
    else if(it.status==='conferido') conferidos++;
    else if(it.status==='alerta_gestor') alertas++;
    else if(it.status==='ok') ok++;
    else if(it.status==='validado') validados++;
  });
  var resolvidos = ok + validados;
  return { total:total, pendentes:pendentes, divergentes:divergentes, aguardandoValidacao:conferidos, alertasGestor:alertas, resolvidos:resolvidos, prontoParaAutorizacao: total>0 && resolvidos===total };
}

/* Sempre busca os itens direto da store (nunca confia no cache local
   itemsByAudit) antes de recalcular o resumo do balanço — evita uma
   corrida entre a escrita do item e a atualização assíncrona do cache
   reativo, que fazia o resumo ser salvo com números desatualizados. */
async function recalcAndPersist(auditId){
  var store = await storeReady;
  var snap = await store.collection('items').where('auditId','==',auditId).get();
  var items = snap.docs.map(function(d){ return d.data(); });
  var agg = computeAggregateFromItems(items);
  await store.doc('audits/'+auditId).update({
    totalItens: agg.total, pendentes: agg.pendentes, divergentes: agg.divergentes,
    aguardandoValidacao: agg.aguardandoValidacao, alertasGestor: agg.alertasGestor, resolvidos: agg.resolvidos,
    prontoParaAutorizacao: agg.prontoParaAutorizacao
  });
}

function stageOf(audit){
  if(!audit) return 'coleta';
  if(audit.autorizadoEm) return 'encerrado';
  var t = audit.totalItens||0;
  if(t>0 && audit.resolvidos===t) return 'autorizacao';
  if((audit.pendentes||0)>0) return 'coleta';
  if((audit.divergentes||0)>0) return 'conferencia';
  if((audit.aguardandoValidacao||0)>0 || (audit.alertasGestor||0)>0) return 'validacao';
  return 'coleta';
}
var STAGE_LABEL = { coleta:'Em coleta', conferencia:'Em conferência', validacao:'Em validação', autorizacao:'Aguardando autorização', encerrado:'Encerrado' };

/* ---------------- Router ---------------- */
function parseHash(){
  var h = location.hash.replace(/^#\/?/,'');
  var seg = h.split('/').filter(Boolean).map(decodeURIComponent);
  if(seg.length===0) return { name:'home' };
  if(seg[0]==='balancos') return { name:'balancos' };
  if(seg[0]==='novo-balanco') return { name:'novo-balanco' };
  if(seg[0]==='importar') return { name:'importar' };
  if(seg[0]==='fila') return { name:'fila' };
  if(seg[0]==='perfil') return { name:'perfil' };
  if(seg[0]==='balanco' && seg[1]){
    var auditId = seg[1], sub = seg[2];
    if(!sub) return { name:'audit-detail', auditId:auditId };
    if(sub==='coletar' && seg[3]) return { name:'coletar-item', auditId:auditId, sku:seg[3] };
    if(sub==='coletar') return { name:'coletar-lista', auditId:auditId };
    if(sub==='conferencia' && seg[3]) return { name:'conferir-item', auditId:auditId, sku:seg[3] };
    if(sub==='conferencia') return { name:'conferencia-lista', auditId:auditId };
    if(sub==='validacao' && seg[3]) return { name:'validar-item', auditId:auditId, sku:seg[3] };
    if(sub==='validacao') return { name:'validacao-lista', auditId:auditId };
    if(sub==='alerta' && seg[3]) return { name:'alerta-item', auditId:auditId, sku:seg[3] };
    if(sub==='alerta') return { name:'alerta-lista', auditId:auditId };
    if(sub==='autorizar') return { name:'autorizar', auditId:auditId };
    if(sub==='novo-item') return { name:'novo-item', auditId:auditId };
    if(sub==='itens') return { name:'itens-todos', auditId:auditId };
  }
  return { name:'home' };
}
function go(route){ location.hash = '#/'+route; }

var NAV_ROOTS = ['home','balancos','fila','perfil'];

function ensureSubscriptions(route){
  subscribeAudits();
  var needsItems = ['audit-detail','coletar-item','coletar-lista','conferir-item','conferencia-lista','validar-item','validacao-lista','alerta-lista','alerta-item','autorizar','novo-item','itens-todos'];
  if(needsItems.indexOf(route.name)!==-1 && route.auditId){
    subscribeItemsForAudit(route.auditId);
  } else {
    unsubscribeItems();
  }
  if(route.name==='fila'){
    var st = profile.papel==='conferente' ? 'divergente' : profile.papel==='supervisor' ? 'conferido' : profile.papel==='gestor' ? 'alerta_gestor' : 'pendente';
    subscribeQueue(st);
  } else {
    unsubscribeQueue();
  }
}

function queueCountForRole(){

  }
  var st = profile.papel==='conferente' ? 'divergente' : profile.papel==='supervisor' ? 'conferido' : 'pendente';
  return (itemsQueue[st]||[]).length;

    it.contagens.map(function(c){ return c.numero+'ª contagem: <strong>'+fmtNum(c.valor)+'</strong> '+esc(it.unidade||'un')+' — '+esc(c.por); }).join('<br>')+

      '<div class="li-sub">'+esc(it.sku)+' · '+esc(it.categoria)+'</div>'+

    '<div class="li-sub" style="margin-top:4px;">'+ic('building',13)+' '+esc(it.localizacao)+'</div>'+

      '<div class="compare-box"><div class="cb-label">Sistema</div><div class="cb-value">'+fmtNum(it.qtdSistema)+'</div></div>'+

    '</div>'+
    '<div class="kv-row"><span class="k">Diferença</span><span class="v" style="color:var(--color-ember);">'+(diff>0?'+':'')+fmtNum(diff)+' '+esc(it.unidade||'un')+'</span></div>'+

    '<div class="kv-row"><span class="k">Em</span><span class="v">'+fmtDate(it.contadoEm)+'</span></div>'+

function screenFila(){
  var role = profile.papel;
  if(role==='gestor'){
    var alertas = itemsQueue.alerta_gestor||[];
    var list = Object.values(audits).filter(function(a){ return a.prontoParaAutorizacao && !a.autorizadoEm; });
    if(!alertas.length && !list.length) return emptyState('checkcircle','Fila vazia','Nenhum balanço aguardando autorização nem alerta de contagem no momento.');
    var alertasHtml = !alertas.length ? '' : '<div class="section-title">Alertas de contagem (3ª contagem)</div>' + alertas.map(function(it){
      var a = audits[it.auditId];
      var diff = it.qtdContada - it.qtdSistema;
      return '<div class="list-item" data-action="nav" data-route="balanco/'+esc(it.auditId)+'/alerta/'+esc(it.sku)+'">'+
        '<div class="icon-wrap" style="color:var(--color-ember);">'+ic('alert',18)+'</div>'+
        '<div class="li-body"><div class="li-title">'+esc(it.descricao)+'</div><div class="li-sub">'+esc(a?a.nome:'')+' · '+esc(it.sku)+'</div></div>'+
        '<div class="li-trail"><span class="li-qty danger">'+(diff>0?'+':'')+fmtNum(diff)+'</span>'+ic('chevright',16)+'</div>'+
      '</div>';
    }).join('');
    var autorizarHtml = !list.length ? '' : '<div class="section-title">Aguardando autorização</div>' + list.map(auditListItem).join('');
    return alertasHtml + autorizarHtml;
  }
  var st = role==='conferente' ? 'divergente' : role==='supervisor' ? 'conferido' : 'pendente';
  var routeSeg = role==='conferente' ? 'conferencia' : role==='supervisor' ? 'validacao' : 'coletar';
  var items = itemsQueue[st]||[];
  if(!items.length) return emptyState('checkcircle','Fila vazia', 'Nenhum item aguardando '+(role==='conferente'?'conferência':role==='supervisor'?'validação':'coleta')+' no momento.');
  return '<div class="section-title">'+items.length+' item(ns) aguardando você</div>' + items.map(function(it){
    var a = audits[it.auditId];
    return '<div class="list-item" data-action="nav" data-route="balanco/'+esc(it.auditId)+'/'+routeSeg+(st==='pendente'?'/'+esc(it.sku):'/'+esc(it.sku))+'">'+
      '<div class="icon-wrap">'+ic(role==='conferente'?'alert':role==='supervisor'?'shield':'package',18)+'</div>'+
      '<div class="li-body"><div class="li-title">'+esc(it.descricao)+'</div><div class="li-sub">'+esc(a?a.nome:'')+' · '+esc(it.sku)+'</div></div>'+
      '<div class="li-trail">'+ic('chevright',16)+'</div>'+
    '</div>';
  }).join('');
}

var Forms = {
  'novo-balanco': async function(form){
    var fd = new FormData(form);
    var id = 'bal-' + uid();
    var store = await storeReady;
    await store.doc('audits/'+id).set({
      nome: fd.get('nome'), local: fd.get('local'), responsavel: fd.get('responsavel'),
      tolerancia: Number(fd.get('tolerancia'))||0, criadoEm: new Date().toISOString(),
      totalItens:0, pendentes:0, divergentes:0, aguardandoValidacao:0, resolvidos:0, prontoParaAutorizacao:false
    });
    toast('Balanço criado.');
    go('balanco/'+id);
  },
  'novo-item': async function(form){
    var fd = new FormData(form);
    var auditId = form.dataset.audit;
    var skuRaw = String(fd.get('sku')||'').trim();
    var sku = skuRaw.replace(/[^A-Za-z0-9_\-.~:@+]/g,'-') || uid();
    var store = await storeReady;
    await store.collection('items').doc(auditId+'__'+sku).set({
      auditId: auditId, sku: skuRaw, descricao: fd.get('descricao'), categoria: fd.get('categoria'),
      localizacao: fd.get('localizacao'), qtdSistema: Number(fd.get('qtdSistema'))||0, unidade:'un',
      qtdContada: null, status:'pendente'
    });
    await recalcAndPersist(auditId);
    toast('Item adicionado ao balanço.');
    go('balanco/'+auditId);
  },
  'coletar-item': async function(form){
    var fd = new FormData(form);
    var auditId = form.dataset.audit, sku = form.dataset.sku;
    var it = (itemsByAudit[auditId]||{})[sku]; if(!it) return;
    var qtd = Number(fd.get('qtd'));
    var numero = (it.numContagens||0) + 1;
    var bateu = qtd === it.qtdSistema;
    var status = bateu ? 'ok' : (numero >= MAX_CONTAGENS ? 'alerta_gestor' : 'divergente');
    var historico = (it.contagens||[]).concat([{ numero: numero, valor: qtd, por: profile.nome, em: new Date().toISOString() }]);
    var store = await storeReady;
    await store.doc('items/'+it.id).update({
      qtdContada: qtd, status: status, contadoPor: profile.nome, contadoEm: new Date().toISOString(),
      observacaoContagem: fd.get('obs')||'', numContagens: numero, contagens: historico
    });
    await recalcAndPersist(auditId);
    toast(bateu ? 'Contagem confere com o sistema.' : (status==='alerta_gestor' ? 'Limite de '+MAX_CONTAGENS+' contagens atingido — alerta enviado ao gestor.' : (numero+'ª contagem registrada com divergência.')));
    go('balanco/'+auditId+'/coletar');
  },
  'conferir-item': async function(form, submitter){
    var auditId = form.dataset.audit, sku = form.dataset.sku;
    var it = (itemsByAudit[auditId]||{})[sku]; if(!it) return;
    var fd = new FormData(form);
    var intent = submitter && submitter.dataset.intent;
    var store = await storeReady;
    if(intent==='recontagem'){
      await store.doc('items/'+it.id).update({ qtdContada:null, status:'pendente', observacaoContagem:'', observacaoConferencia: fd.get('obs')||'' });
      toast((( it.numContagens||0)+1)+'ª contagem solicitada.');
    } else {
      await store.doc('items/'+it.id).update({ status:'conferido', conferidoPor: profile.nome, conferidoEm: new Date().toISOString(), observacaoConferencia: fd.get('obs')||'' });
      toast('Divergência confirmada, aguardando validação.');
    }
    await recalcAndPersist(auditId);
    go('balanco/'+auditId+'/conferencia');
  },
  'validar-item': async function(form, submitter){
    var auditId = form.dataset.audit, sku = form.dataset.sku;
    var it = (itemsByAudit[auditId]||{})[sku]; if(!it) return;
    var fd = new FormData(form);
    var intent = submitter && submitter.dataset.intent;
    var wasAlerta = it.status==='alerta_gestor';
    var store = await storeReady;
    if(intent==='recontagem'){
      await store.doc('items/'+it.id).update({ qtdContada:null, status:'pendente', observacaoContagem:'', observacaoConferencia:'', observacaoValidacao: fd.get('obs')||'' });
      toast((( it.numContagens||0)+1)+'ª contagem solicitada.');
    } else {
      await store.doc('items/'+it.id).update({ status:'validado', validadoPor: profile.nome, validadoEm: new Date().toISOString(), observacaoValidacao: fd.get('obs')||'' });
      toast(wasAlerta ? 'Decisão do gestor registrada.' : 'Ajuste validado.');
    }
    await recalcAndPersist(auditId);
    if(wasAlerta){ go('balanco/'+auditId+'/alerta'); return; }
    go('balanco/'+auditId+'/validacao');
  },
  'autorizar': async function(form){
    var auditId = form.dataset.audit;
    var fd = new FormData(form);
    var store = await storeReady;
    await store.doc('audits/'+auditId).update({
      autorizadoPor: profile.nome, autorizadoEm: new Date().toISOString(), observacaoEncerramento: fd.get('obs')||''
    });
    toast('Balanço encerrado e ajustes autorizados.');
    go('balanco/'+auditId);
  },
  'perfil': async function(form){
    var fd = new FormData(form);
    profile.nome = String(fd.get('nome')||'Você').trim() || 'Você';
    Profile.set(profile);
    if(USING_SUPABASE && sbClient && SB_STATE.userId){
      try{ await sbClient.from('profiles').update({ nome: profile.nome }).eq('id', SB_STATE.userId); }catch(e){ console.error(e); }
    }
    toast('Perfil atualizado.');
    render();
  },
  'login': async function(form){
    var fd = new FormData(form);
    var errEl = document.getElementById('login-error');
    function showErr(msg){ if(errEl){ var m=errEl.querySelector('.err-msg'); if(m) m.textContent = msg; errEl.hidden = false; } }

    if(!supabaseConfigured()){
      var usuario = String(fd.get('usuario')||'').trim();
      var senha = String(fd.get('senha')||'');
      if(usuario.toLowerCase()!==DEMO_USER || senha!==DEMO_PASS){
        showErr('Usuário ou senha incorretos. Confira os dados de demonstração acima.');
        return;
      }
      if(errEl) errEl.hidden = true;
      Auth.signIn();
      enterApp(true);
      return;
    }

    var codigo = String(fd.get('codigo')||'').trim().toUpperCase();
    var email = String(fd.get('email')||'').trim();
    var senha2 = String(fd.get('senha')||'');
    var client = getSbClient();
    if(!client){ showErr('Não foi possível conectar ao Supabase.'); return; }
    try{
      var empRes = await client.from('empresas').select('id,codigo,nome').eq('codigo', codigo).maybeSingle();
      if(empRes.error || !empRes.data){ showErr('Código de empresa não encontrado.'); return; }
      var authRes = await client.auth.signInWithPassword({ email: email, password: senha2 });
      if(authRes.error){ showErr('E-mail ou senha incorretos.'); return; }
      var ok = await loadSupabaseProfile(client, authRes.data.user, empRes.data);
      if(!ok){ await client.auth.signOut(); showErr('Este usuário não pertence à empresa informada.'); return; }
      if(errEl) errEl.hidden = true;
      enterApp(true);
    }catch(err){
      console.error(err);
      showErr('Não foi possível entrar. Tente novamente.');
    }
  }
};

async function loadSupabaseProfile(client, user, empresa){
  var res = await client.from('profiles').select('empresa_id,nome,papel').eq('id', user.id).maybeSingle();
  if(res.error || !res.data || res.data.empresa_id !== empresa.id) return false;
  SB_STATE.empresaId = empresa.id;
  SB_STATE.empresaCodigo = empresa.codigo;
  SB_STATE.userId = user.id;
  profile.nome = res.data.nome;
  profile.papel = res.data.papel;
  Profile.set(profile);
  finalizeSupabaseLogin(client);
  return true;
}

var Actions = {
  nav: function(ds){ go(ds.route); },
  filterBalancos: function(ds){ screenBalancos._filter = ds.filter; render(); },
  fillDemo: function(ds){
    var emailEl = document.getElementById('f-email');
    if(emailEl) emailEl.value = ds.email;
    document.querySelectorAll('.chip[data-action="fillDemo"]').forEach(function(c){
      c.classList.toggle('active', c.dataset.email===ds.email);
    });
  },
  setRole: function(ds){ if(USING_SUPABASE) return; profile.papel = ds.role; Profile.set(profile); render(); },
  logout: function(){
    if(USING_SUPABASE && sbClient){
      sbClient.auth.signOut().finally(function(){ location.reload(); });
      return;
    }
    Auth.signOut();
    location.hash = '';
    showLogin();
  },
  importMock: async function(){
    var store = await storeReady;
    var id = 'bal-mock-' + uid();
    var pool = MOCK_PRODUCTS.slice();
    var n = Math.min(pool.length, randInt(6,10));
    var chosen = [];
    for(var i=0;i<n;i++){ chosen.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    var pendentes=0, divergentes=0, aguardandoValidacao=0, resolvidos=0;
    var writes = chosen.map(function(p){
      var sku = p.sku + randInt(1000,9999);
      var qtdSistema = randInt(10,300);
      var roll = Math.random();
      var data = {
        auditId:id, sku:sku, descricao:p.descricao, categoria:p.categoria,
        localizacao:'Corredor '+randInt(1,9)+' - Prateleira '+String.fromCharCode(65+randInt(0,4))+randInt(1,5),
        qtdSistema:qtdSistema, unidade:p.unidade, qtdContada:null, status:'pendente'
      };
      if(roll<0.35){
        pendentes++;
      } else if(roll<0.60){
        data.qtdContada = qtdSistema; data.status='ok'; data.contadoPor='Importação mock'; data.contadoEm=new Date().toISOString();
        resolvidos++;
      } else if(roll<0.80){
        var diff = randInt(1, Math.max(2,Math.round(qtdSistema*0.15)));
        data.qtdContada = qtdSistema + (Math.random()<0.5?-diff:diff);
        data.status='divergente'; data.contadoPor='Importação mock'; data.contadoEm=new Date().toISOString();
        divergentes++;
      } else {
        var diff2 = randInt(1, Math.max(2,Math.round(qtdSistema*0.1)));
        data.qtdContada = Math.max(0, qtdSistema - diff2); data.status='conferido';
        data.contadoPor='Importação mock'; data.contadoEm=new Date().toISOString();
        data.conferidoPor=profile.nome; data.conferidoEm=new Date().toISOString();
        data.observacaoConferencia='Divergência confirmada automaticamente na importação de exemplo.';
        aguardandoValidacao++;
      }
      return store.collection('items').doc(id+'__'+sku).set(data);
    });
    await Promise.all(writes);
    var total = chosen.length;
    await store.doc('audits/'+id).set({
      nome:'Balanço Mock '+ new Date().toLocaleDateString('pt-BR'),
      local: pick(MOCK_LOCAIS), responsavel: profile.nome, criadoEm: new Date().toISOString(), tolerancia: 3,
      totalItens: total, pendentes: pendentes, divergentes: divergentes, aguardandoValidacao: aguardandoValidacao,
      resolvidos: resolvidos, prontoParaAutorizacao: total>0 && resolvidos===total
    });
    toast('Balanço de exemplo importado com '+total+' itens.');
    go('balanco/'+id);
  }
};

function showLogin(){
  document.getElementById('app').hidden = true;
  document.getElementById('app').classList.remove('fading-in');

  shell.hidden = false;
  shell.classList.remove('fading-out');

function enterApp(withFade){
  var loginShell = document.getElementById('login-shell');
  var app = document.getElementById('app');
  function mount(){
    loginShell.hidden = true;
    loginShell.classList.remove('fading-out');
    app.hidden = false;
    if(withFade){
      app.classList.remove('fading-in');
      void app.offsetWidth;
      app.classList.add('fading-in');
    }
    location.hash = '#/';
    render();
  }
  if(withFade){
    loginShell.classList.add('fading-out');
    setTimeout(mount, 360);
  } else {
    mount();
  }
}

function isLoggedIn(){
  if(supabaseConfigured()) return USING_SUPABASE && !!SB_STATE.empresaId;
  return Auth.isIn();
}

function enterAppNoFade(){
  document.getElementById('login-shell').hidden = true;
  document.getElementById('app').hidden = false;
  render();
}

async function boot(){
  if(supabaseConfigured()){
    var client = getSbClient();
    if(client){
      try{
        var sRes = await client.auth.getSession();
        var session = sRes.data && sRes.data.session;
        if(session && session.user){
          var profRes = await client.from('profiles').select('empresa_id,nome,papel').eq('id', session.user.id).maybeSingle();
          if(profRes.data){
            var empRes = await client.from('empresas').select('id,codigo').eq('id', profRes.data.empresa_id).maybeSingle();
            if(empRes.data){
              SB_STATE.empresaId = empRes.data.id;
              SB_STATE.empresaCodigo = empRes.data.codigo;
              SB_STATE.userId = session.user.id;
              profile.nome = profRes.data.nome;
              profile.papel = profRes.data.papel;
              Profile.set(profile);
              finalizeSupabaseLogin(client);
              enterAppNoFade();
              return;
            }
          }
        }
      }catch(e){ console.error(e); }
    }
    showLogin();
    return;
  }
  if(Auth.isIn()){ enterAppNoFade(); } else { showLogin(); }
}

/* ---------------- Boot animation (splash antes do login) ---------------- */
function playBootChime(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    var ctx = new Ctx();
    var notes = [523.25, 659.25, 783.99, 1046.50]; // C5 - E5 - G5 - C6
    var t0 = ctx.currentTime;
    notes.forEach(function(freq, i){
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      var start = t0 + i*0.11, dur = 0.24;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.16, start+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+dur+0.02);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 900);
  }catch(e){}
}

function runBootScreen(){
  return new Promise(function(resolve){
    var shell = document.getElementById('boot-shell');
    if(!shell){ resolve(); return; }
    var done = false;
    function finish(){
      if(done) return; done = true;
      shell.classList.add('fading-out');
      setTimeout(function(){ shell.hidden = true; resolve(); }, 300);
    }
    shell.addEventListener('click', finish, {once:true});
    setTimeout(playBootChime, 560);
    setTimeout(finish, 2200);
  });
}
